<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}TSUE Bot Admin{% endblock %}</title>
<style>
  :root {
    --primary: #2563eb;
    --bg: #f5f6fa;
    --card: #ffffff;
    --border: #e2e5ec;
    --text: #1f2430;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header a { color: var(--text); text-decoration: none; font-weight: 700; font-size: 18px; }
  nav a {
    color: var(--muted);
    text-decoration: none;
    margin-left: 18px;
    font-size: 14px;
  }
  nav a:hover { color: var(--primary); }
  main { max-width: 960px; margin: 32px auto; padding: 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
  }
  .stat-card h3 { margin: 0 0 8px; font-size: 15px; }
  .stat-card .count { font-size: 28px; font-weight: 700; color: var(--primary); }
  .stat-card .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .stat-card a.btn { display: inline-block; margin-top: 12px; }
  .btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn:hover { opacity: 0.9; }
  .btn.secondary { background: #e5e7eb; color: var(--text); }
  textarea {
    width: 100%;
    min-height: 480px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    resize: vertical;
  }
  .error {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fecaca;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 14px;
  }
  .success {
    background: #f0fdf4;
    color: #166534;
    border: 1px solid #bbf7d0;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 14px;
  }
  form.inline { display: inline; }
  .toolbar { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  input[type=file] { font-size: 13px; }
</style>
</head>
<body>
<header>
  <a href="/">📅 TSUE Bot Admin</a>
  <nav>
    <a href="/">Bosh sahifa</a>
    <a href="/names">Sarlavha nomlari</a>
    <a href="/hierarchy">Ierarxiya sozlamalari</a>
  </nav>
</header>
<main>
  {% block content %}{% endblock %}
</main>
</body>
</html>
